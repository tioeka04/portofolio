# Supabase free plan mem-pause project yang tidak ada aktivitas selama ±7 hari.
# Workflow ini "menyapa" database setiap 3 hari supaya tetap aktif.
# Butuh 2 secret di GitHub repo → Settings → Secrets and variables → Actions:
#   SUPABASE_URL        (mis. https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY   (anon / publishable key)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # tiap 3 hari, 03:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query projects table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          test "$status" = "200"
